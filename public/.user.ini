; Upload limits deliberately raised so admins can drop in full-resolution
; photography and lookbook PDFs without hitting a cap.
; Note: upload_max_filesize has no "unlimited" value in PHP, so it is set very
; high; post_max_size = 0 does mean unlimited.
upload_max_filesize = 2048M
post_max_size = 0
max_file_uploads = 200

; Big uploads take time to receive and to re-encode.
max_execution_time = 0
max_input_time = -1
memory_limit = 1024M
