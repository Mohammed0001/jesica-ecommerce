; Upload limits raised so admins can drop in full-resolution photography and
; lookbook PDFs. Images are downscaled in the browser and again by
; ImageService, so the request itself stays modest.
upload_max_filesize = 2048M
post_max_size = 2048M
max_file_uploads = 200

; Generous, but FINITE. A request that stalls must die with a reportable
; error; max_execution_time = 0 turned every stall into an endless spinner
; with no message, and left the stuck worker holding its DB locks.
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
